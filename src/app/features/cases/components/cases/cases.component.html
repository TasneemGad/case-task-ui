<div [dir]="currentLang() === 'ar' ? 'rtl' : 'ltr'"
  class="min-h-screen bg-[#f8f9fa] font-sans text-slate-800 flex flex-col md:flex-row-reverse">

  <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto max-w-7xl w-full">
    <div class="flex flex-col-reverse sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <div class="text-end sm:text-start w-full sm:w-auto">
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">{{ 'header.title' | translate }}</h1>
        <p class="text-xs text-slate-400 mt-1">{{ 'header.subtitle' | translate }}</p>
      </div>
      <button
        class="w-full sm:w-auto bg-[#c49a6c] hover:bg-[#b08759] text-white px-5 py-2.5 rounded-xl font-medium shadow-xs transition-colors flex items-center justify-center gap-2 text-xs">
        <span class="text-base font-bold"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M3.33337 8H12.6667" stroke="white" stroke-width="1.33333" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M8 3.33333V12.6667" stroke="white" stroke-width="1.33333" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </span>
        <span>{{ 'header.newCase' | translate }}</span>
      </button>


    </div>

    <div [dir]="currentLang() === 'ar' ? 'rtl' : 'ltr'"
      class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4 mb-6">
      <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-slate-200/80 text-xs overflow-x-auto">
        @for (tab of filterTabs; track tab.key) {
        <button (click)="activeTab.set(tab.key)"
          [class]="activeTab() === tab.key ? 'bg-slate-100 text-slate-900 font-bold' : 'text-slate-500 hover:text-slate-800'"
          class="px-3 sm:px-5 py-2 rounded-lg transition-all whitespace-nowrap shrink-0">
          {{ tab.translationKey | translate }}
        </button>
        }
      </div>
      <div class="relative flex-1 min-w-0 sm:min-w-64">
        <input type="text" [placeholder]="'filters.searchPlaceholder' | translate"
          class="w-full  ps-10 pe-4  py-3  bg-white border border-slate-200/80 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#c49a6c]/40 text-start placeholder:text-slate-400" />
        <svg class="w-4 h-4 text-slate-400 absolute inset-s-3 top-3.5" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <div class="flex items-center gap-3 w-full lg:w-auto">


        <div class="flex bg-white p-1 rounded-xl border border-slate-200/80 shrink-0">
          <button class="p-1.5 bg-[#c49a6c] text-white rounded-lg shadow-xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <button class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <app-table [data]="cases().data" [config]="casesTableConfig" [currentLang]="currentLang"
      (rowAction)="onRowAction($event)" (selectionChange)="onSelectionChange($event)"
      (sortChange)="onSortChange($event)" />

    <app-pagination [currentPage]="currentPage()" [totalPages]="cases().pagination.totalItems"
      [currentLang]="currentLang()" (pageChange)="onPageChange($event)" />
  </main>
</div>
