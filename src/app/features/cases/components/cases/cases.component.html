<div class=" font-sans text-ink flex flex-col md:flex-row-reverse rounded-b-2xl">

  <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto w-full">

    <div class="flex flex-col-reverse sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <div class=" w-full sm:w-auto">
        <h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-ink tracking-tight">{{ 'header.title' | translate }}
        </h1>
        <p class="text-xs text-secondary-text mt-1">{{ 'header.subtitle' | translate }}</p>
      </div>
      <button
        class="w-full sm:w-auto bg-brand-gold hover:opacity-90 text-surface px-5 py-2.5 rounded-xl font-medium shadow-xs transition-colors flex items-center justify-center gap-2 text-xs">
        <span class="text-base font-bold"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M3.33337 8H12.6667" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M8 3.33333V12.6667" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </span>
        <span>{{ 'header.newCase' | translate }}</span>
      </button>
    </div>

    <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3 sm:gap-4 mb-6">

      <div
        class="flex items-center gap-1 bg-pagination p-1 rounded-xl border border-border text-xs overflow-x-auto w-auto lg:w-auto">
        @for (tab of filterTabs; track tab.key) {
        <button (click)="activeTab.set(tab.key)"
          [class]="activeTab() === tab.key ? 'border border-text-ink text-ink font-bold' : 'text-secondary-text hover:text-ink'"
          class="px-3 sm:px-5 py-2 rounded-lg transition-all whitespace-nowrap shrink-0 bg-white ">
          {{ tab.translationKey | translate }}
        </button>
        }
      </div>
      <div class="relative flex-1 min-w-0 sm:min-w-64">
        <input type="text" [placeholder]="'filters.searchPlaceholder' | translate"
          class="w-full ps-10 pe-4 py-3 bg-surface border border-border rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-brand-gold/40 text-start placeholder:text-secondary-text" />
        <svg class="w-4 h-4 text-secondary-text absolute inset-s-3 top-3.5" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 sm:gap-4 w-full lg:w-auto">

        <div
          class="inline-flex items-center gap-1 rounded-2xl bg-canvas p-1 border border-border self-center sm:self-auto shrink-0">
          <button type="button" (click)="setViewMode('list')" [class]="viewMode() === 'list'
        ? 'rounded-xl bg-brand-gold text-surface shadow-xs'
        : 'rounded-xl bg-surface text-secondary-text hover:text-ink'"
            class="flex h-10 w-10 items-center justify-center transition-all duration-200">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="7" x2="20" y2="7" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="17" x2="20" y2="17" />
            </svg>
          </button>
          <button type="button" (click)="setViewMode('grid')" [class]="viewMode() === 'grid'
        ? 'rounded-xl bg-brand-gold text-surface shadow-xs'
        : 'rounded-xl bg-surface text-secondary-text hover:text-ink'"
            class="flex h-10 w-10 items-center justify-center transition-all duration-200">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    @if (viewMode() === 'list') {
    <div class="w-full overflow-x-auto -mx-4 px-4 sm:mx-0 sm:px-0">
      <app-table [data]="filteredCases()" [config]="casesTableConfig" [currentLang]="currentLang"
        (rowAction)="onRowAction($event)" (selectionChange)="onSelectionChange($event)"
        (sortChange)="onSortChange($event)" />
    </div>
    }

    @if (viewMode() === 'grid') {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (item of filteredCases(); track item.id) {
      <app-case-card [item]="item" />
      }
    </div>
    }

    <app-pagination [currentPage]="currentPage()" [totalPages]="cases().pagination.totalItems"
      [currentLang]="currentLang()" (pageChange)="onPageChange($event)" />
  </main>
</div>
