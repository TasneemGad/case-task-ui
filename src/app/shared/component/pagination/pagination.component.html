<div [dir]="currentLang() === 'ar' ? 'rtl' : 'ltr'"
  class="flex flex-col sm:flex-row items-center  gap-4 text-xs text-slate-500">
  <div class="flex items-center justify-start gap-2">
    <div
      class="relative inline-flex items-center bg-slate-100/70 border border-slate-200/60 rounded-full px-3.5 py-1.5 text-slate-700">
      <span class="font-medium text-slate-600 me-1">{{ 'pagination.show' | translate }}</span>

      <select
        class="bg-transparent text-slate-700 font-semibold focus:outline-none cursor-pointer appearance-none pe-2">
        <option value="18">18</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <svg class="w-3.5 h-3.5 text-slate-400 me-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>
  <button type="button" (click)="prevPage()" [disabled]="currentPage() === 1"
    class="w-9 h-9 flex items-center justify-center rounded-full border border-slate-200/80 bg-white text-slate-800 hover:bg-slate-50 transition-colors disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
    <svg class="rtl:rotate-180" width="7" height="12" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5.5 10.5L0.5 5.5L5.5 0.5" stroke="#191919" stroke-width="1.2" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>

  @for (page of pages(); track $index) {
  @if (page === '...' || page === '…') {
  <span class="text-slate-700 font-semibold px-0.5">...</span>
  } @else {
  <button type="button" (click)="onPageClick(page)"
    [class]="page === currentPage()
          ? 'w-9 h-9 flex items-center justify-center rounded-full bg-[#C9A96E] text-white shadow-xs font-bold text-sm cursor-pointer'
          : 'w-8 h-8 flex items-center justify-center font-bold text-slate-800 text-sm hover:text-slate-600 transition-colors cursor-pointer'">
    {{ page }}
  </button>
  }
  }

  <button type="button" (click)="nextPage()" [disabled]="currentPage() === totalPages()"
    class="w-9 h-9 flex items-center justify-center rounded-full border border-slate-200/80 bg-[#C9A96E] text-white  hover:bg-slate-50 transition-colors disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
    <svg class="rtl:rotate-180" width="7" height="12" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0.5 10.5L5.5 5.5L0.5 0.5" stroke="white" stroke-width="1.2" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>

</div>
