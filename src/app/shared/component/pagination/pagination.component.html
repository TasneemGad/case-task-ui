<div class="flex flex-col sm:grid sm:grid-cols-3 items-center gap-4 text-xs text-secondary-text w-full">

  <div class="flex items-center justify-start gap-2">
    <div
      class="relative inline-flex items-center bg-canvas border border-border rounded-full px-3.5 py-1.5 text-ink transition-all duration-200 hover:border-border/80 focus-within:ring-2 focus-within:ring-brand-gold focus-within:ring-offset-1">
      <span class="font-medium text-secondary-text me-1 select-none">{{ 'pagination.show' | translate }}</span>

      <select
        class="bg-transparent text-ink font-semibold focus:outline-none cursor-pointer appearance-none pe-2">
        <option value="18">18</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <svg class="w-3.5 h-3.5 text-secondary-text me-2 pointer-events-none transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>

  <div class="flex items-center justify-center gap-1.5">
    <button type="button" (click)="prevPage()" [disabled]="currentPage() === 1"
      class="w-9 h-9 flex items-center justify-center rounded-full border border-border bg-surface text-ink hover:bg-canvas active:scale-90 transition-all duration-150 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-gold focus-visible:ring-offset-1 cursor-pointer">
      <svg class="rtl:rotate-180 transition-transform duration-150" width="7" height="12" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5.5 10.5L0.5 5.5L5.5 0.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>

    @for (page of pages(); track $index) {
      @if (page === '...' || page === '…') {
        <span class="text-ink font-semibold px-0.5 select-none">...</span>
      } @else {
        <button type="button" (click)="onPageClick(page)"
          [class]="page === currentPage()
                ? 'w-9 h-9 flex items-center justify-center rounded-full bg-pagination shadow-xs font-bold text-sm cursor-pointer scale-105 active:scale-95 transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-gold focus-visible:ring-offset-1'
                : 'w-8 h-8 flex items-center justify-center rounded-full font-bold text-ink text-sm hover:text-brand-gold hover:bg-canvas active:scale-90 transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-gold focus-visible:ring-offset-1 cursor-pointer'">
          {{ page }}
        </button>
      }
    }

    <button type="button" (click)="nextPage()" [disabled]="currentPage() === totalPages()"
      class="w-9 h-9 flex items-center justify-center rounded-full border border-border bg-brand-gold text-surface hover:opacity-90 hover:brightness-105 active:scale-90 transition-all duration-150 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-gold focus-visible:ring-offset-1 cursor-pointer">
      <svg class="rtl:rotate-180 transition-transform duration-150" width="7" height="12" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0.5 10.5L5.5 5.5L0.5 0.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <div class="hidden sm:block"></div>

</div>
