<header [dir]="currentLang() === 'ar' ? 'rtl' : 'ltr'"
  class="w-full bg-white px-6 py-4 flex justify-between items-center rounded-t-2xl border-b border-slate-100">

  <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-sm">
    <ol class="flex items-center gap-2">

      @for (item of breadcrumbs(); track item.url; let last = $last) {
      <li class="inline-flex items-center gap-2">

        @if (!last) {
        <a [routerLink]="item.url" class="font-semibold text-slate-800 hover:text-slate-900 transition-colors">
          {{ item.label | translate }}
        </a>

        <svg class="w-3.5 h-3.5 text-slate-400 ltr:rotate-0 rtl:rotate-180" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
        } @else {
        <span aria-current="page" class="text-slate-400 font-normal truncate max-w-50">
          {{ item.label | translate }}
        </span>
        }

      </li>
      }

    </ol>
  </nav>

</header>
